name: Swift SDK Heartbeat

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

concurrency:
  group: swift-sdk-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: wallets API contract (preview)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Cache SPM packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Run heartbeat suite
      id: first
      continue-on-error: true
      env:
        TEST_RUNNER_PREVIEW_CK_KEY: ${{ secrets.PREVIEW_CK_KEY }}
      run: make heartbeat-test

    - name: Retry once before alerting
      id: retry
      if: steps.first.outcome == 'failure'
      env:
        TEST_RUNNER_PREVIEW_CK_KEY: ${{ secrets.PREVIEW_CK_KEY }}
      run: make heartbeat-test

    - name: Notify Slack on failure
      if: failure() && steps.retry.outcome == 'failure'
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_QA_ALERTS_WEBHOOK }}
      run: |
        curl --fail-with-body -sS -X POST -H 'Content-type: application/json' \
          --data "{\"text\": \":rotating_light: Swift SDK heartbeat failed twice in a row — the wallets API contract may have changed. <https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID|View run>\"}" \
          "$SLACK_WEBHOOK"
