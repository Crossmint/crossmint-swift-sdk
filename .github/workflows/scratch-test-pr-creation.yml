name: SCRATCH Test PR Creation

# Temporary. Verifies the default GITHUB_TOKEN can open a PR under the repo's
# rules, which is the one unknown for the release automation. Self-cleans.
# DELETE this file before merging the release workflows.

on:
  push:
    branches:
      - tomas/wal-10998-swift-release-workflow

jobs:
  test-pr:
    name: Bot can open a PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create scratch branch
      id: branch
      run: |
        BRANCH="scratch-pr-test-${{ github.run_id }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -b "$BRANCH"
        git commit --allow-empty -m "Scratch commit to test PR creation"
        git push origin "$BRANCH"
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

    - name: Open PR with GITHUB_TOKEN
      id: pr
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        URL=$(gh pr create \
          --title "SCRATCH: verify bot PR creation (auto-closed)" \
          --body "Throwaway PR to confirm GITHUB_TOKEN can open PRs. The workflow closes it automatically." \
          --base main \
          --head "${{ steps.branch.outputs.branch }}")
        echo "PR created: $URL"
        echo "url=$URL" >> "$GITHUB_OUTPUT"

    - name: Clean up
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -n "${{ steps.pr.outputs.url }}" ]; then
          gh pr close "${{ steps.pr.outputs.url }}" --delete-branch || true
        else
          git push origin --delete "${{ steps.branch.outputs.branch }}" || true
        fi
