name: Swift

on:
  pull_request:
        types:
            - opened
            - synchronize
            - ready_for_review
            - converted_to_draft
  push:
      branches:
          - main

env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

jobs:
  build:
    name: Build and Test
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.0'
    
    - name: Cache SPM packages
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Build & run tests
      timeout-minutes: 15
      run: |
        make ci-test
    
    - name: Run SwiftLint
      run: make lint
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          TestResults.xcresult
          test_results.xml

  # Advisory: a failure here can be the API or the key, not the SDK. Do not add to required checks.
  integration:
    name: Integration tests (advisory)
    runs-on: xcode-27
    continue-on-error: true
    if: github.event.pull_request.draft == false

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Decide whether the SDK changed
      id: changed
      run: |
        base="${{ github.event.pull_request.base.sha || github.event.before }}"
        if git diff --name-only "$base" HEAD | grep -qE '^(Sources/|Tests/IntegrationTests/|Package\.swift|Package\.resolved)'; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Xcode
      if: steps.changed.outputs.run == 'true'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.0'

    - name: Cache SPM packages
      if: steps.changed.outputs.run == 'true'
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    # Scoped to this step only. xcodebuild forwards TEST_RUNNER_* to the test process.
    - name: Run integration tests
      if: steps.changed.outputs.run == 'true'
      timeout-minutes: 20
      env:
        TEST_RUNNER_PREVIEW_CK_KEY: ${{ secrets.PREVIEW_CK_KEY }}
      run: |
        make integration-test