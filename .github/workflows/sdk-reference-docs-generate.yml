name: SDK Reference Docs Generate
# On pushes to main that touch the SDK source or docs tooling, generates the
# Swift SDK reference docs (DocC → MDX), uploads them as an artifact, and
# dispatches to crossbit-main where the receiver workflow copies them into the
# Mintlify docs and opens a PR for review.
# Releases also invoke this workflow directly via workflow_call from release.yml.

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "scripts/docc-to-markdown.py"
      - "Makefile"
      - "Package.swift"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to generate docs from (defaults to the triggering ref)"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Git ref to generate docs from"
        required: false
        type: string

env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

permissions:
  contents: read

concurrency:
  group: sdk-reference-docs-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-docs:
    name: Generate SDK Reference Docs
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Generate MDX docs
        run: make docs DOCS_OUTPUT=sdk-reference/wallets/swift

      - name: Verify docs were generated
        run: |
          if [ -z "$(find sdk-reference/ -name '*.mdx' -print -quit)" ]; then
            echo "No MDX files generated"
            exit 1
          fi

      - name: Upload generated docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-reference-docs
          path: sdk-reference/
          retention-days: 7

      - name: Generate App Token
        id: generate_app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.CROSSMINT_DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.CROSSMINT_DEPLOY_BOT_PRIVATE_KEY }}
          owner: Paella-Labs
          repositories: crossbit-main
          permission-contents: write

      - name: Dispatch to crossbit-main
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ steps.generate_app_token.outputs.token }}
          repository: Paella-Labs/crossbit-main
          event-type: sdk-reference-docs-update
          client-payload: '{"run_id": "${{ github.run_id }}", "packages": "wallets/swift", "source_repo": "crossmint-swift-sdk", "source_ref": ${{ toJSON(inputs.ref || github.ref_name) }}}'
